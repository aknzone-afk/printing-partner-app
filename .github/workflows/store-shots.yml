# Printing Partner store screenshots: the real app on an Android emulator,
# photographing the main customer screens (home / product packages / orders /
# profile). PNGs are uploaded as an artifact for both the App Store and Play
# listings. Started by hand only (workflow_dispatch) — nothing auto-runs.
#
# NOTE: store_shots_test.dart imports package:integration_test. That package is
# NOT yet in app/pubspec.yaml dev_dependencies. Before this workflow can run,
# the owner must add (one line, see STORE_SUBMISSION.md):
#     integration_test:
#       sdk: flutter
name: Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: app
          script: flutter drive --driver=test_driver/shots.dart --target=integration_test/store_shots_test.dart --profile --no-dds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screenshots
          path: app/screenshots/
