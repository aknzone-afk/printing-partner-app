# App Store screenshots on iOS SIMULATORS (reliable — the Android emulator won't
# boot on GitHub runners). Boots each sim, walks the customer flow
# (integration_test/review_flow_test.dart, which pauses on each screen) and
# captures a simctl screenshot every ~1.5s. Artifact per device = PNGs at that
# device's native App Store size. The app is universal (iPhone + iPad), so we
# capture BOTH an iPhone Pro Max (6.9") and an iPad Pro 13" set; resize the 6.9"
# iPhone shots to 6.3" afterwards (same aspect) if a medium-iPhone set is needed.
# Started by hand only (macOS minutes are costly).
name: iOS store screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: iphone
            label: iphone-6_9
          - kind: ipad
            label: ipad-13
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Flutter dependencies
        working-directory: app
        run: |
          flutter config --no-analytics --no-enable-swift-package-manager
          flutter pub get
          flutter precache --ios

      - name: Set up Ruby + gems (cocoapods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: app/ios

      - name: Install pods
        working-directory: app/ios
        run: bundle exec pod install --repo-update

      - name: Boot a ${{ matrix.kind }} simulator
        id: sim
        env:
          KIND: ${{ matrix.kind }}
        run: |
          UDID=$(xcrun simctl list devices available -j | KIND="$KIND" python3 -c '
          import json,sys,os
          kind=os.environ["KIND"]
          d=json.load(sys.stdin)["devices"]
          rts=sorted([r for r in d if "iOS" in r], key=lambda r:[int(x) for x in r.split("iOS-")[1].split("-")])
          def pick(pred):
              for rt in reversed(rts):
                  m=[x for x in d[rt] if x["name"].startswith(("iPhone","iPad")) and pred(x["name"])]
                  if m: return m[-1]["udid"]
              return None
          if kind=="ipad":
              u=pick(lambda n: n.startswith("iPad") and ("Pro" in n) and ("13" in n or "12.9" in n)) \
                or pick(lambda n: n.startswith("iPad") and "Pro" in n) \
                or pick(lambda n: n.startswith("iPad"))
          else:
              u=pick(lambda n: n.startswith("iPhone") and "Pro Max" in n) \
                or pick(lambda n: n.startswith("iPhone") and "Plus" in n) \
                or pick(lambda n: n.startswith("iPhone"))
          print(u or "")')
          test -n "$UDID"
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: Build the app for the simulator first
        working-directory: app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Walk the flow and capture screenshots
        working-directory: app
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          mkdir -p ../out
          ( i=0; while true; do
              printf -v n "%03d" "$i"
              xcrun simctl io "$UDID" screenshot --type=png "../out/shot_$n.png" >/dev/null 2>&1 || true
              i=$((i+1)); sleep 1.5
            done ) &
          CAP=$!
          flutter test integration_test/review_flow_test.dart -d "$UDID" 2>&1 | tee ../out/test.log || true
          sleep 2
          kill "$CAP" 2>/dev/null || true
          cd ../out
          python3 - <<'PY'
          import hashlib, os, glob
          seen=set()
          for f in sorted(glob.glob("shot_*.png")):
              h=hashlib.md5(open(f,"rb").read()).hexdigest()
              if h in seen: os.remove(f)
              else: seen.add(h)
          print("unique screenshots:", len(seen))
          PY
          ls -la

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: printing-partner-shots-${{ matrix.label }}
          path: out/
